<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabula — Suas planilhas, organizadas em um só lugar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --bg:#f5f7fa;--panel:#ffffff;--panel2:#eef2f6;--text:#0f172a;--mut:#64748b;--line:#e2e8f0;
 --brand:#0d9488;--brand2:#0fbfa8;--brand-soft:rgba(13,148,136,.1);--brand-soft2:rgba(13,148,136,.18);
 --amber:#f59e0b;--danger:#e11d48;--ok:#16a34a;--info:#2563eb;
 --sh:0 1px 2px rgba(15,23,42,.05),0 10px 30px rgba(15,23,42,.07);
 --sh2:0 20px 60px rgba(15,23,42,.18);--r:12px;
 --grid-line:#dfe5ec;--grid-head:#f1f4f8;--sel:rgba(13,148,136,.14);--sel-head:rgba(13,148,136,.22);
}
[data-theme=dark]{
 --bg:#0b1120;--panel:#101a2e;--panel2:#16233c;--text:#e5ecf6;--mut:#8fa3bd;--line:#223250;
 --brand:#2dd4bf;--brand2:#5eead4;--brand-soft:rgba(45,212,191,.12);--brand-soft2:rgba(45,212,191,.2);
 --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);--sh2:0 20px 60px rgba(0,0,0,.55);
 --grid-line:#24344f;--grid-head:#152238;--sel:rgba(45,212,191,.16);--sel-head:rgba(45,212,191,.28);
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Sora',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
.ic-s{width:15px;height:15px}.ic-l{width:22px;height:22px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-weight:600;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff}.btn-p:hover{filter:brightness(1.1)}
.btn-o{border-color:var(--line);background:var(--panel)}.btn-o:hover{border-color:var(--brand);color:var(--brand)}
.btn-g{color:var(--mut)}.btn-g:hover{background:var(--panel2);color:var(--text)}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn-lg{padding:13px 26px;font-size:16px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px}
.b-free{background:var(--panel2);color:var(--mut)}.b-pro{background:var(--brand-soft2);color:var(--brand)}.b-premium{background:rgba(245,158,11,.16);color:var(--amber)}.b-admin{background:rgba(225,29,72,.12);color:var(--danger)}
.b-ok{background:rgba(22,163,74,.14);color:var(--ok)}.b-warn{background:rgba(245,158,11,.16);color:var(--amber)}.b-bad{background:rgba(225,29,72,.12);color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
#toasts{position:fixed;top:16px;right:16px;z-index:4000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:12px 16px;box-shadow:var(--sh2);display:flex;gap:10px;align-items:flex-start;animation:tin .25s}
.toast.err{border-left-color:var(--danger)}.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--amber)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#modal-root{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(8,12,24,.55);backdrop-filter:blur(3px);padding:20px}
#modal-root.on{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--sh2);width:100%;max-width:480px;max-height:92vh;overflow:auto;animation:min .2s}
.modal.lg{max-width:760px}
@keyframes min{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.m-b{padding:22px}.m-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.menu{position:fixed;z-index:3500;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);min-width:190px;padding:6px;animation:min .12s}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;text-align:left;font-weight:500}
.menu button:hover{background:var(--panel2)}
.menu button.danger{color:var(--danger)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
.hint{font-size:12px;color:var(--mut)}
.lnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:22px;padding:14px 5%;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.lnav.sc{border-color:var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:'Sora';font-weight:800;font-size:19px}
.logo-mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff}
.lnav .links{display:flex;gap:20px;margin-left:14px;color:var(--mut);font-weight:500}
.lnav .links a:hover{color:var(--brand)}
.lnav .acts{margin-left:auto;display:flex;gap:10px;align-items:center}
.hero{padding:80px 5% 60px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:-40% -20% auto;height:130%;background:radial-gradient(600px 300px at 30% 20%,var(--brand-soft),transparent 60%),radial-gradient(500px 280px at 75% 10%,rgba(245,158,11,.08),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.12;letter-spacing:-1px;max-width:820px;margin:0 auto}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--mut);font-size:18px;max-width:560px;margin:18px auto 28px}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border:1px solid var(--brand-soft2);padding:5px 14px;border-radius:30px;margin-bottom:20px}
.hero-mock{max-width:760px;margin:56px auto 0;border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--sh2);border:1px solid var(--line);background:var(--panel)}
.hm-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--mut)}
.hm-dot{width:10px;height:10px;border-radius:50%}
.hm-fx{display:flex;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.hm-fx b{font-family:monospace;background:var(--brand-soft);color:var(--brand);padding:2px 10px;border-radius:6px}
.hm-grid{display:grid;grid-template-columns:36px repeat(5,1fr)}
.hm-grid div{padding:8px 10px;border-right:1px solid var(--grid-line);border-bottom:1px solid var(--grid-line);font-size:12.5px;min-height:34px}
.hm-grid .hh{background:var(--grid-head);color:var(--mut);font-weight:600;text-align:center;font-size:11.5px}
.hm-grid .hl{background:var(--sel);font-weight:600;color:var(--brand)}
.hm-grid .hn{text-align:right}
section.blk{padding:72px 5%;max-width:1160px;margin:0 auto}
.blk h2{font-size:clamp(24px,3vw,34px);text-align:center;letter-spacing:-.5px}
.blk .sub{text-align:center;color:var(--mut);max-width:560px;margin:12px auto 44px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.feat{padding:24px}
.feat .fi{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin-bottom:14px}
.feat h3{font-size:16px;margin-bottom:6px}.feat p{color:var(--mut);font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;counter-reset:st}
.step{padding:26px;position:relative}
.step::before{counter-increment:st;content:counter(st);font-family:'Sora';font-weight:800;font-size:44px;color:var(--brand-soft2);position:absolute;top:14px;right:20px}
.step h3{font-size:15px;margin-bottom:6px}.step p{color:var(--mut);font-size:13.5px}
.price{padding:28px;display:flex;flex-direction:column;position:relative;transition:.2s}
.price.hl{border:2px solid var(--brand);box-shadow:0 18px 50px var(--brand-soft2)}
.price .p-tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:3px 14px;border-radius:20px}
.price h3{font-size:18px}.price .pv{font-family:'Sora';font-size:36px;font-weight:800;margin:10px 0 2px}
.price .pv small{font-size:13px;color:var(--mut);font-weight:500}
.price ul{list-style:none;margin:18px 0 22px;flex:1}
.price li{display:flex;gap:9px;padding:5px 0;font-size:13.5px;color:var(--mut)}
.price li .ic{color:var(--brand);margin-top:2px}
.faq{max-width:720px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{padding:18px 4px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;list-style:none}
.faq summary::after{content:'+';font-size:20px;color:var(--brand);transition:.2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 4px 18px;color:var(--mut);font-size:14px}
.cta-final{text-align:center;background:linear-gradient(135deg,var(--brand),#0a7a6f);border-radius:22px;padding:60px 30px;color:#fff;margin:0 5% 70px}
.cta-final h2{color:#fff}.cta-final p{color:rgba(255,255,255,.85);margin:12px auto 26px;max-width:480px}
.cta-final .btn{background:#fff;color:#0a7a6f}
footer{border-top:1px solid var(--line);padding:44px 5%;display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;color:var(--mut);font-size:13px}
footer .col{display:flex;flex-direction:column;gap:8px}
footer .col b{color:var(--text);font-size:13.5px}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 400px at 20% 0%,var(--brand-soft),transparent),var(--bg)}
.auth{width:100%;max-width:420px;padding:34px}
.auth h1{font-size:22px;margin:18px 0 6px}.auth .sub{color:var(--mut);margin-bottom:22px}
.auth .alt{text-align:center;margin-top:16px;font-size:13px;color:var(--mut)}
.auth .alt a{color:var(--brand);font-weight:600}
.demo-hint{margin-top:18px;background:var(--panel2);border-radius:9px;padding:11px 13px;font-size:12px;color:var(--mut)}
.demo-hint code{color:var(--brand);font-weight:600}
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 10px 16px}
.snav button,.snav a{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:9px;color:var(--mut);font-weight:500;margin-bottom:2px}
.snav button:hover,.snav a:hover{background:var(--panel2);color:var(--text)}
.snav .on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.snav .cnt{margin-left:auto;font-size:11px;background:var(--panel2);padding:1px 7px;border-radius:10px}
.side .s-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line)}
.usage{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.usage i{display:block;height:100%;background:var(--brand);border-radius:6px}
.main{flex:1;min-width:0;padding:26px 30px}
.m-h2{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.m-h2 h1{font-size:22px;letter-spacing:-.4px}
.search{position:relative;flex:1;max-width:380px;min-width:200px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-left:36px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--mut);background:var(--panel)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat{padding:18px}
.stat .sv{font-family:'Sora';font-size:24px;font-weight:700;margin-top:2px}
.stat .sl{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:7px}
.stat .sl .ic{color:var(--brand)}
.doc-tbl{width:100%;overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:.12s}
.tbl tbody tr:hover{background:var(--panel2)}
.doc-name{display:flex;align-items:center;gap:10px;font-weight:600}
.doc-ico{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.star-btn{color:var(--line);display:inline-flex}.star-btn.on{color:var(--amber)}
.star-btn:hover{color:var(--amber)}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--mut)}
.icon-btn:hover{background:var(--panel2);color:var(--text)}
.empty{text-align:center;padding:70px 20px;color:var(--mut)}
.empty .e-ic{width:64px;height:64px;border-radius:18px;background:var(--panel2);display:grid;place-items:center;margin:0 auto 16px;color:var(--brand)}
.tpl-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tpl-c{border:1px solid var(--line);border-radius:11px;padding:16px;cursor:pointer;position:relative;transition:.15s;background:var(--panel)}
.tpl-c:hover{border-color:var(--brand);box-shadow:var(--sh)}
.tpl-c .badge{position:absolute;top:10px;right:10px}
.tpl-c h4{font-size:13.5px;margin:10px 0 3px}.tpl-c p{font-size:11.5px;color:var(--mut)}
.tpl-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.ed{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.ed-top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-name{font-weight:700;font-size:15px;border:1px solid transparent;border-radius:7px;padding:4px 8px;background:transparent;max-width:260px;width:auto}
.ed-name:hover{border-color:var(--line)}.ed-name:focus{border-color:var(--brand);background:var(--panel)}
.save-st{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;min-width:86px}
.save-st .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save-st.saving .dot{background:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.ed-top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.toolbar{display:flex;align-items:center;gap:3px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbtn{min-width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);padding:0 6px;position:relative}
.tbtn:hover{background:var(--panel2)}
.tbtn.on{background:var(--brand-soft);color:var(--brand)}
.tbtn:disabled{opacity:.4}
.tsep{width:1px;height:22px;background:var(--line);margin:0 6px}
.toolbar select{width:auto;padding:4px 8px;font-size:12.5px;border-radius:7px}
.fxbar{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);padding:4px 12px}
.fx-ref{min-width:64px;text-align:center;font-weight:700;font-size:12px;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:4px 8px;font-family:monospace}
.fx-ic{color:var(--mut);font-style:italic;font-family:Georgia,serif;font-weight:700}
.fxbar input{border:none;background:transparent;padding:5px 4px;box-shadow:none}
.fxbar input:focus{box-shadow:none}
.grid-wrap{flex:1;overflow:auto;position:relative;outline:none;background:var(--panel)}
table.grid{border-collapse:collapse;table-layout:fixed;user-select:none}
.grid th,.grid td{border:1px solid var(--grid-line);height:26px}
.grid thead th{position:sticky;top:0;z-index:5;background:var(--grid-head);color:var(--mut);font-weight:600;font-size:11.5px;height:26px}
.grid thead th.corner{left:0;z-index:7;width:46px;min-width:46px;max-width:46px}
.grid .rh{position:sticky;left:0;z-index:4;background:var(--grid-head);color:var(--mut);font-weight:600;font-size:11px;width:46px;min-width:46px;max-width:46px;text-align:center}
.grid thead th.hl,.grid .rh.hl{background:var(--sel-head);color:var(--brand)}
.grid td{background:var(--panel);padding:0 6px;font-size:13px;overflow:hidden;white-space:nowrap;cursor:cell}
.grid td.sel{background:var(--sel)}
.grid td.anchor{outline:2px solid var(--brand);outline-offset:-1px}
.grid td.bd{box-shadow:inset 0 0 0 1px var(--text)}
.grid td.err{color:var(--danger);font-weight:600}
.grid td.num{text-align:right}
.grid td.editing{padding:0;overflow:visible;position:relative}
.grid td.editing input{position:absolute;left:0;top:0;z-index:9;border:2px solid var(--brand);border-radius:0;padding:2px 6px;font-size:13px;box-shadow:var(--sh);width:max(100%,140px);background:var(--panel)}
.colrsz{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:6}
.rowrsz{position:absolute;left:0;bottom:-3px;width:100%;height:6px;cursor:row-resize;z-index:5}
.ed-tabs{display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);min-height:38px;flex-wrap:wrap}
.tab{padding:7px 16px;font-size:12.5px;font-weight:600;color:var(--mut);border-radius:8px 8px 0 0;cursor:pointer;border:1px solid transparent;border-bottom:none;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab:hover{background:var(--panel2)}
.tab.on{background:var(--bg);color:var(--brand);border-color:var(--line)}
.tab.drag-over{border-color:var(--brand)}
.ed-tabs .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;padding:6px 0}
.sumbar b{color:var(--brand)}
.ro-banner{background:rgba(245,158,11,.14);color:var(--amber);font-size:12.5px;font-weight:600;text-align:center;padding:5px}
.anav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.anav button{padding:8px 16px;border-radius:9px;font-weight:600;color:var(--mut);border:1px solid var(--line);background:var(--panel)}
.anav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bars{display:flex;align-items:flex-end;gap:16px;height:130px;padding:10px 4px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--mut)}
.bars .bar i{width:100%;max-width:64px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--brand2),var(--brand))}
.log-row{font-family:monospace;font-size:12px;padding:7px 10px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}

/* ---------- fórmulas ---------- */
const FN={'SOMA':'SUM','SUM':'SUM','MEDIA':'AVG','MÉDIA':'AVG','AVERAGE':'AVG','MINIMO':'MIN','MÍNIMO':'MIN','MIN':'MIN','MAXIMO':'MAX','MÁXIMO':'MAX','MAX':'MAX','CONTAGEM':'COUNT','CONT':'COUNT','COUNT':'COUNT','SE':'IF','IF':'IF','CONCATENAR':'CAT','CONCAT':'CAT'};
function cellVal(sh,key,ctx){
 if(ctx.cache.hasOwnProperty(key))return ctx.cache[key];
 const c=sh.cells[key];
 if(!c||((c.v===undefined||c.v==='')&&!c.f)){ctx.cache[key]='';return''}
 if(c.f){
  if(ctx.stack.has(key))throw'#CIRC!';
  ctx.stack.add(key);let r;
  try{r=evalX(c.f.replace(/^=/,''),sh,ctx)}catch(e){r=(typeof e==='string'&&e.startsWith('#'))?e:'#ERRO'}
  ctx.stack.delete(key);ctx.cache[key]=r;return r;
 }
 const n=toNum(c.v);ctx.cache[key]=(n!==null?n:String(c.v));return ctx.cache[key];
}
function ser(v,strs){if(typeof v==='number')return isFinite(v)?String(v):'#ERRO';if(typeof v==='boolean')return v?'1':'0';strs.push(String(v));return'\x01'+(strs.length-1)+'\x01'}
function splitArgs(s){if(s.includes(';'))return s.split(';');if(s.includes(','))return s.split(',');return[s]}
function collectNums(parts,sh,ctx){const nums=[];
 for(const p of parts){const pm=/^\$?([A-Z]{1,3})\$?(\d+):\$?([A-Z]{1,3})\$?(\d+)$/.exec(p.trim());
  if(pm){const a=parseRef(pm[1]+pm[2]),b=parseRef(pm[3]+pm[4]);
   for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++)for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++){
    const v=cellVal(sh,keyOf(r,c),ctx);if(typeof v==='number')nums.push(v)}}
  else{const v=evalX(p,sh,ctx);if(typeof v==='number')nums.push(v)}}
 return nums}
function callFn(name,argsStr,sh,ctx,strs){
 const parts=argsStr.trim()===''?[]:splitArgs(argsStr).map(s=>s.trim());
 if(name==='IF'){
  if(parts.length<2)throw'#ERRO';
  const cond=truthy(evalX(parts[0],sh,ctx));
  const br=cond?parts[1]:(parts[2]!==undefined?parts[2]:'""');
  return evalX(br,sh,ctx);
 }
 if(name==='CAT'){let out='';for(const p of parts){const pm=/^([A-Z]{1,3}\d+):([A-Z]{1,3}\d+)$/.exec(p);
  if(pm){const a=parseRef(pm[1]),b=parseRef(pm[2]);for(let r=a.r;r<=b.r;r++)for(let c=a.c;c<=b.c;c++){const v=cellVal(sh,keyOf(r,c),ctx);out+=v===''?'':String(v)}}
  else{const v=evalX(p,sh,ctx);out+=v===''?'':String(v)}}return out}
 const nums=collectNums(parts,sh,ctx);
 if(name==='SUM')return nums.reduce((a,b)=>a+b,0);
 if(name==='AVG'){if(!nums.length)throw'#DIV/0!';return nums.reduce((a,b)=>a+b,0)/nums.length}
 if(name==='MIN')return nums.length?Math.min.apply(null,nums):0;
 if(name==='MAX')return nums.length?Math.max.apply(null,nums):0;
 if(name==='COUNT')return nums.length;
 throw'#ERRO';
}
function truthy(v){if(v===true)return true;if(typeof v==='number')return v!==0;if(typeof v==='string')return v!==''&&!['FALSO','FALSE'].includes(v.toUpperCase());return false}
function evalX(s,sh,ctx){
 const strs=[];
 s=s.replace(/"([^"]*)"/g,function(m,x){strs.push(x);return'\x01'+(strs.length-1)+'\x01'});
 s=s.toUpperCase();
 let g=0,m;const re=/([A-ZÀ-Ü][A-ZÀ-Ü0-9]*)\(([^()]*)\)/;
 while((m=re.exec(s))){
  if(++g>300)throw'#ERRO';
  const raw=m[1].normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const name=FN[m[1]]||FN[raw]||null;
  if(!name)throw'#NOME?';
  const v=callFn(name,m[2],sh,ctx,strs);
  s=s.slice(0,m.index)+ser(v,strs)+s.slice(m.index+m[0].length);
 }
 s=s.replace(/\$?([A-Z]{1,3})\$?(\d{1,7})/g,function(mm,c,r){return ser(cellVal(sh,c+r,ctx),strs)});
 return calc(s,strs);
}
function calc(s,strs){
 const out=[],ops=[];
 const prec={'u':6,'^':5,'*':4,'/':4,'+':3,'-':3,'&':2,'=':1,'<':1,'>':1,'<=':1,'>=':1,'<>':1};
 let i=0,prev=null;
 const pushOp=function(o){while(ops.length&&ops[ops.length-1]!=='('&&(prec[ops[ops.length-1]]>prec[o]||(prec[ops[ops.length-1]]===prec[o]&&o!=='^'&&o!=='u')))out.push({o:ops.pop()});ops.push(o)};
 while(i<s.length){
  const ch=s[i];
  if(ch===' '){i++;continue}
  if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;out.push({v:parseFloat(s.slice(i,j))});prev='v';i=j;continue}
  if(ch==='\x01'){const j=s.indexOf('\x01',i+1);out.push({v:strs[+s.slice(i+1,j)]});prev='v';i=j+1;continue}
  if(ch==='('){ops.push('(');prev='(';i++;continue}
  if(ch===')'){while(ops.length&&ops[ops.length-1]!=='(')out.push({o:ops.pop()});if(!ops.length)throw'#ERRO';ops.pop();prev='v';i++;continue}
  let op=null;
  if(s.startsWith('<=',i))op='<=';else if(s.startsWith('>=',i))op='>=';else if(s.startsWith('<>',i))op='<>';else if('+-*/^&=<>'.includes(ch))op=ch;
  if(op){
   if(op==='-'&&(!prev||prev==='op'||prev==='(')){pushOp('u')}
   else if(op==='+'&&(!prev||prev==='op'||prev==='(')){/* + unário */}
   else pushOp(op);
   prev='op';i+=op.length;continue}
  throw'#ERRO';
 }
 while(ops.length){const o=ops.pop();if(o==='(')throw'#ERRO';out.push({o})}
 const st=[];
 const num=function(x){if(typeof x==='number')return x;if(x===''||x==null)return 0;const n=typeof x==='string'?toNum(x):NaN;return n===null?NaN:n};
 for(const t of out){
  if('v'in t){st.push(t.v);continue}
  if(t.o==='u'){if(st.length<1)throw'#ERRO';const a=st.pop();const na=num(a);if(isNaN(na))throw'#VALOR!';st.push(-na);continue}
  if(st.length<2)throw'#ERRO';
  const b=st.pop(),a=st.pop();
  let r;
  switch(t.o){
   case'&':r=(a===''?'':String(a))+(b===''?'':String(b));break;
   case'=':r=(typeof a==='number'&&typeof b==='number')?a===b:String(a).toLowerCase()===String(b).toLowerCase();break;
   case'<>':r=!((typeof a==='number'&&typeof b==='number')?a===b:String(a).toLowerCase()===String(b).toLowerCase());break;
   case'<':case'>':case'<=':case'>=':{
    if(typeof a==='number'&&typeof b==='number'){r=t.o==='<'?a<b:t.o==='>'?a>b:t.o==='<='?a<=b:a>=b}
    else{const cmp=String(a).localeCompare(String(b));r=t.o==='<'?cmp<0:t.o==='>'?cmp>0:t.o==='<='?cmp<=0:cmp>=0}break}
   default:{const na=num(a),nb=num(b);if(isNaN(na)||isNaN(nb))throw'#VALOR!';
    if(t.o==='+')r=na+nb;else if(t.o==='-')r=na-nb;else if(t.o==='*')r=na*nb;
    else if(t.o==='/'){if(nb===0)throw'#DIV/0!';r=na/nb}else if(t.o==='^')r=Math.pow(na,nb);else throw'#ERRO'}}
  st.push(r);
 }
 if(st.length!==1)throw'#ERRO';
 return st[0];
}
function computeSheet(sh){
 const ctx={stack:new Set(),cache:{}};const disp={};
 for(const k in sh.cells){const c=sh.cells[k];
  if(c.f){let v;try{v=evalX(c.f.replace(/^=/,''),sh,ctx)}catch(e){v=(typeof e==='string')?e:'#ERRO'}disp[k]=v}}
 sh._disp=disp;return disp;
}
function fmtVal(v,fmt){
 if(v===''||v==null)return'';
 if(typeof v==='string'&&v.startsWith('#'))return v;
 const n=typeof v==='number'?v:toNum(v);
 if(fmt==='cur'&&n!==null)return fmtBRL(n);
 if(fmt==='pct'&&n!==null)return fmtNum(n*100)+'%';
 if(fmt==='num'&&n!==null)return fmtNum(n);
 if(fmt==='dat'){
  if(n!==null){const d=new Date(Date.UTC(1899,11,30)+n*864e5);return d.toLocaleDateString('pt-BR',{timeZone:'UTC'})}
  if(typeof v==='string'){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v.trim());if(m)return m[1].padStart(2,'0')+'/'+m[2].padStart(2,'0')+'/'+m[3];
   const d=new Date(v);if(!isNaN(d))return d.toLocaleDateString('pt-BR')}}
 if(typeof v==='number')return Number.isInteger(v)?String(v):v.toLocaleString('pt-BR',{maximumFractionDigits:6});
 return String(v);
}

function importCSV(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';
 inp.onchange=function(){const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=function(){
   const txt=rd.result;const first=txt.split(/\r?\n/)[0]||'';
   const delim=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
   const rows=[];let row=[],cur='',q=false;
   for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch}
   if(cur!==''||row.length){row.push(cur);rows.push(row)}
   const cells={};const maxR=Math.min(rows.length,api.plan().maxRows);
   rows.slice(0,maxR).forEach(function(r,ri){r.forEach(function(v,ci){if(v!=='')cells[keyOf(ri,ci)]=mkCell(v)})});
   const data={sheets:[{id:uid(),name:'Importado',rows:Math.max(rows.length+10,50),cols:Math.max.apply(null,rows.map(function(r){return r.length}).concat([8]))+2,cells}]};
   const rr=api.createDoc(f.name.replace(/\.csv$/i,''),data);
   if(rr.err){toast(rr.err,'err');return upgradeModal()}
   toast('CSV importado com sucesso!','ok');location.hash='#/editor/'+rr.ok.id;
  };rd.readAsText(f,'utf-8')};
 inp.click();
}

function docMenu(el,id,isOwner){
 const r=el.getBoundingClientRect();
 const items=[
  {ic:'eye',label:'Abrir',fn:function(){location.hash='#/editor/'+id}},
  isOwner?{ic:'edit',label:'Renomear',fn:function(){renameDoc(id)}}:null,
  isOwner?{ic:'copy',label:'Duplicar',fn:function(){const rr=api.duplicate(id);rr.err?toast(rr.err,'err'):(toast('Planilha duplicada!','ok'),vApp())}}:null,
  {ic:'share',label:'Compartilhar',fn:function(){shareModal(id)}},
  api.me().admin?{ic:'tpl',label:'Salvar como template',fn:function(){saveAsTemplate(id)}}:null,
  '-',
  isOwner?{ic:'trash',label:'Excluir',danger:1,fn:function(){api.toTrash(id);toast('Enviada para a lixeira.','warn');vApp()}}:null
 ].filter(Boolean);
 popMenu(r.left-150,r.bottom+4,items);
}
function renameDoc(id){

 openModal('<div class="m-h"><h3 style="font-size:16px">Renomear planilha</h3><button class="icon-btn" onclick="closeModal()">'+ic('x')+'</button></div>'+
 '<div class="m-b"><div class="field"><label>Nome</label><input id="rn-i" value="'+esc(d.name)+'"></div></div>'+
 '<div class="m-f"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" id="rn-b">Salvar</button></div>');
 $('#rn-b').onclick=function(){const v=$('#rn-i').value.trim();if(!v)return toast('Nome vazio','err');api.rename(id,v);closeModal();toast('Renomeada!','ok');route()};

function shareModal(id){
 const d=db.docs.find(x=>x.id===id);
 if(d.ownerId!==api.me().id)return toast('Apenas o proprietário pode gerenciar compartilhamento.','err');
 if(!api.plan().share)return upgradeModal('Pro');
 const render=function(){
  const list=d.shares.map(function(s){const t=db.users.find(x=>x.id===s.userId);
   return'<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">'+
   avatar(t,28)+'<div style="flex:1"><b style="font-size:13px">'+esc(t.name)+'</b><div class="hint">'+esc(t.email)+'</div></div>'+
   '<select style="width:auto" data-perm="'+s.userId+'"><option value="view" '+(s.perm==='view'?'selected':'')+'>Visualizar</option><option value="edit" '+(s.perm==='edit'?'selected':'')+'>Editar</option></select>'+
   '<button class="icon-btn" data-un="'+s.userId+'" title="Remover acesso">'+ic('x')+'</button></div>'}).join('');
  openModal('<div class="m-h"><h3 style="font-size:16px">'+ic('share')+' Compartilhar "'+esc(d.name)+'"</h3><button class="icon-btn" onclick="closeModal()">'+ic('x')+'</button></div>'+
  '<div class="m-b">'+
   '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">'+
    '<input id="sh-e" placeholder="E-mail do usuário" style="flex:1;min-width:180px">'+
    '<select id="sh-p" style="width:auto"><option value="view">Visualizar</option><option value="edit">Editar</option></select>'+
    '<button class="btn btn-p" id="sh-b">Convidar</button></div>'+
   '<div id="sh-list">'+(list||'<p class="hint" style="text-align:center;padding:14px">Ninguém tem acesso ainda.</p>')+'</div>'+
  '</div>');
  $('#sh-b').onclick=function(){const r=api.share(id,$('#sh-e').value,$('#sh-p').value);
   if(r.err){toast(r.err,'err');if(r.upgrade)upgradeModal('Pro')}else{toast('Compartilhado com sucesso!','ok');render()}};
  $$('#modal-root [data-un]').forEach(function(b){b.onclick=function(){api.unshare(id,b.dataset.un);toast('Acesso removido.','warn');render()}});
  $$('#modal-root [data-perm]').forEach(function(s){s.onchange=function(){api.share(id,db.users.find(x=>x.id===s.dataset.perm).email,s.value);toast('Permissão atualizada.','ok')}});
 };render();

function saveAsTemplate(id){
 const d=db.docs.find(x=>x.id===id);if(!api.me().admin)return;
 const name=prompt('Nome do template:',d.name);if(!name)return;
 db.templates.push({id:uid(),name:name,desc:'Criado pelo administrador',premium:false,icon:'file',data:JSON.parse(JSON.stringify(d.data))});
 api.log('admin','Criou template "'+name+'"');persist();toast('Template criado!','ok');
}
function vTrashInner(){
 const u=api.me();

 </div>
 <div class="g3" style="margin-bottom:26px">
 ${db.plans.map(function(p){
  const isCur=u.plan===p.id;const isDown=db.plans.findIndex(x=>x.id===p.id)<db.plans.findIndex(x=>x.id===u.plan);

 html+='</tr></thead><tbody>';
 for(let r=0;r<R;r++){
  html+='<tr'+((sh.rh&&sh.rh[r])?' style="height:'+sh.rh[r]+'px"':'')+'><td class="rh" data-rh="'+r+'">'+(r+1)+'<div class="rowrsz" data-rz="'+r+'"></div></td>';
  for(let c=0;c<C;c++)html+='<td data-r="'+r+'" data-c="'+c+'"></td>';

  if(rh){if(E.editing)commitEdit();setSel(+rh.dataset.rh,0,+rh.dataset.rh,curSheet().cols-1);e.preventDefault();return}

  if(td){
   const r=+td.dataset.r,c=+td.dataset.c;

function refreshAll(){
 const sh=curSheet();computeSheet(sh);
 const filled=new Set(Object.keys(sh.cells));
 for(const k in E._prevFilled){if(!filled.has(k)){const p=parseRef(k);const td=E.cellEls[p.r]&&E.cellEls[p.r][p.c];if(td){td.textContent='';td.className='';td.style.cssText=''}}}
 E._prevFilled={};
 for(const k of filled){
  const p=parseRef(k);const td=E.cellEls[p.r]&&E.cellEls[p.r][p.c];if(!td)continue;
  paintCell(td,k);E._prevFilled[k]=1;
 }
 updateSum();syncFx();
}
function paintCell(td,k){
 const sh=curSheet(),c=sh.cells[k],s=c.s||{};
 const disp=sh._disp[k]!==undefined?sh._disp[k]:c.v;
 const txt=fmtVal(disp,s.fmt);
 td.textContent=txt;
 let st='';
 if(s.b)st+='font-weight:700;';if(s.i)st+='font-style:italic;';if(s.u)st+='text-decoration:underline;';
 if(s.al)st+='text-align:'+(s.al==='l'?'left':s.al==='c'?'center':'right')+';';
 else if(typeof disp==='number')st+='text-align:right;';
 if(s.fs)st+='font-size:'+s.fs+'px;';
 if(s.color)st+='color:'+s.color+';';
 if(s.bg&&s.bg!=='var(--grid-head)')st+='background:'+s.bg+';';
 td.style.cssText=st;
 td.className=(s.bd?'bd ':'')+(typeof txt==='string'&&txt.startsWith('#')?'err ':'')+(typeof disp==='number'?'num':'');
}
function setSel(r1,c1,r2,c2){
 E.sel={r1:Math.min(r1,r2),c1:Math.min(c1,c2),r2:Math.max(r1,r2),c2:Math.max(c1,c2)};
 applySel();syncToolbar();
}
function applySel(){
 $$('#grid-wrap td.sel,#grid-wrap td.anchor').forEach(function(td){td.classList.remove('sel','anchor')});
 $$('#grid-wrap th.hl,#grid-wrap td.rh.hl').forEach(function(h){h.classList.remove('hl')});
 const s=E.sel;
 for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){const td=E.cellEls[r]&&E.cellEls[r][c];if(td)td.classList.add('sel')}
 const a=E.cellEls[s.r1]&&E.cellEls[s.r1][s.c1];if(a)a.classList.add('anchor');
 for(let c=s.c1;c<=s.c2;c++){const h=document.querySelector('#grid-wrap [data-ch="'+c+'"]');if(h)h.classList.add('hl')}
 for(let r=s.r1;r<=s.r2;r++){const h=document.querySelector('#grid-wrap [data-rh="'+r+'"]');if(h)h.classList.add('hl')}
 const nb=(s.r1===s.r2&&s.c1===s.c2)?keyOf(s.r1,s.c1):keyOf(s.r1,s.c1)+':'+keyOf(s.r2,s.c2);
 const di=$('#diminfo');if(di)di.textContent=nb+' · '+curSheet().rows+' linhas';
 syncFx();
}
function updateSum(){
 const sh=curSheet(),s=E.sel;let sum=0,cnt=0,n=0;
 for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){
  const cell=sh.cells[keyOf(r,c)];if(!cell)continue;
  const v=sh._disp[keyOf(r,c)]!==undefined?sh._disp[keyOf(r,c)]:cell.v;
  if(typeof v==='number'){sum+=v;n++;cnt++}else if(v!==''&&v!=null)cnt++}
 const sb=$('#sumbar');
 if(sb)sb.innerHTML=(s.r1!==s.r2||s.c1!==s.c2)&&n?'Soma <b>'+fmtNum(sum)+'</b> · Média <b>'+fmtNum(sum/n)+'</b> · Contagem <b>'+cnt+'</b>':'';
}
function syncToolbar(){
 const sh=curSheet(),c=sh.cells[keyOf(E.sel.r1,E.sel.c1)],s=(c&&c.s)||{};
 const on=function(id,v){const el=$(id);if(el)el.classList.toggle('on',!!v)};

function startEdit(r,c,initial){
 if(E.ro)return;
 if(E.editing)commitEdit();
 const cell=curSheet().cells[keyOf(r,c)];
 const td=E.cellEls[r][c];td.classList.add('editing');
 const inp=document.createElement('input');
 inp.value=initial!==undefined?initial:(cell?(cell.f!=null?cell.f:String(cell.v!=null?cell.v:'')):'');
 td.appendChild(inp);inp.focus();
 if(initial===undefined)inp.select();else inp.setSelectionRange(inp.value.length,inp.value.length);
 E.editing={r:r,c:c,inp:inp};
 inp.onkeydown=function(e){
  e.stopPropagation();
  if(e.key==='Enter'){e.preventDefault();commitEdit();moveSel(1,0)}
  else if(e.key==='Tab'){e.preventDefault();commitEdit();moveSel(0,e.shiftKey?-1:1)}
  else if(e.key==='Escape'){cancelEdit()}
 };
 inp.onblur=function(){if(E.editing&&E.editing.inp===inp)commitEdit()};
}
function commitEdit(){
 if(!E.editing)return;
 const r=E.editing.r,c=E.editing.c,inp=E.editing.inp;E.editing=null;
 const td=E.cellEls[r]&&E.cellEls[r][c];if(td)td.classList.remove('editing');
 inp.remove();
 setCellRaw(r,c,inp.value);
}
function cancelEdit(){if(!E.editing)return;E.editing.inp.remove();E.editing=null}
function setCellRaw(r,c,val){
 pushUndo();
 const sh=curSheet(),k=keyOf(r,c);
 let cell=sh.cells[k]||{};
 if(val===''){delete cell.v;delete cell.f;if(!cell.s||!Object.keys(cell.s).length)delete sh.cells[k];else sh.cells[k]=cell}
 else{cell.v=val;cell.f=val.startsWith('=')?val:null;sh.cells[k]=cell}
 computeSheet(sh);refreshAll();touch();
}
function moveSel(dr,dc){
 const sh=curSheet();
 const r=Math.max(0,Math.min(sh.rows-1,E.sel.r1+dr)),c=Math.max(0,Math.min(sh.cols-1,E.sel.c1+dc));
 setSel(r,c,r,c);
 const td=E.cellEls[r]&&E.cellEls[r][c];if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
}
function onGridKey(e){
 if(E.editing)return;
 const k=e.key;
 if(k==='ArrowUp'){e.preventDefault();moveSel(-1,0)}
 else if(k==='ArrowDown'){e.preventDefault();moveSel(1,0)}
 else if(k==='ArrowLeft'){e.preventDefault();moveSel(0,-1)}
 else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();moveSel(0,k==='Tab'&&e.shiftKey?-1:1)}
 else if(k==='Enter'||k==='F2'){e.preventDefault();startEdit(E.sel.r1,E.sel.c1)}
 else if(k==='Delete'||k==='Backspace'){e.preventDefault();clearSel()}
 else if(e.ctrlKey||e.metaKey){
  const kk=k.toLowerCase();
  if(kk==='z'){e.preventDefault();doUndo()}
  else if(kk==='y'){e.preventDefault();doRedo()}
  else if(kk==='c'){e.preventDefault();doCopy()}
  else if(kk==='x'){e.preventDefault();doCut()}
  else if(kk==='b'){e.preventDefault();applyStyle('b')}
  else if(kk==='i'){e.preventDefault();applyStyle('i')}
  else if(kk==='u'){e.preventDefault();applyStyle('u')}
  else if(kk==='s'){e.preventDefault();saveNow();toast('Planilha salva!','ok')}
 }
 else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){startEdit(E.sel.r1,E.sel.c1,k)}
}
function clearSel(){
 if(E.ro)return;pushUndo();
 const sh=curSheet(),s=E.sel;
 for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){
  const k=keyOf(r,c),cell=sh.cells[k];
  if(cell){delete cell.v;delete cell.f;if(!cell.s||!Object.keys(cell.s).length)delete sh.cells[k]}}
 computeSheet(sh);refreshAll();touch();
}
function applyStyle(key){const first=curSheet().cells[keyOf(E.sel.r1,E.sel.c1)];
 const cur=first&&first.s&&first.s[key];const s={};s[key]=cur?undefined:1;setStyle(s)}
function setStyle(patch,clearAll){
 if(E.ro)return;pushUndo();
 const sh=curSheet(),s=E.sel;
 for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){
  const k=keyOf(r,c);let cell=sh.cells[k];
  if(!cell){cell={v:'',f:null};sh.cells[k]=cell}
  if(clearAll){delete cell.s;continue}
  cell.s=cell.s||{};
  for(const key in patch){if(patch[key]===undefined||patch[key]==='')delete cell.s[key];else cell.s[key]=patch[key]}
  if(!Object.keys(cell.s).length)delete cell.s;
  if((cell.v===''||cell.v===undefined)&&!cell.f&&!cell.s)delete sh.cells[k];
 }
 refreshAll();syncToolbar();touch();
}
function clipTSV(){
 const sh=curSheet(),s=E.sel;const rows=[];
 for(let r=s.r1;r<=s.r2;r++){const cols=[];
  for(let c=s.c1;c<=s.c2;c++){const k=keyOf(r,c);const v=sh._disp[k]!==undefined?sh._disp[k]:(sh.cells[k]?sh.cells[k].v:'');cols.push(v==null?'':String(v))}
  rows.push(cols.join('\t'))}
 return rows.join('\n');
}
function doCopy(){const s=E.sel;const sh=curSheet();const data={};
 for(let r=s.r1;r<=s.r2;r++)for(let c=s.c1;c<=s.c2;c++){const cell=sh.cells[keyOf(r,c)];if(cell)data[(r-s.r1)+'_'+(c-s.c1)]=JSON.parse(JSON.stringify(cell))}
 E.clip={data:data,r1:s.r1,c1:s.c1,rows:s.r2-s.r1+1,cols:s.c2-s.c1+1,cut:false};
 try{if(navigator.clipboard)navigator.clipboard.writeText(clipTSV())}catch(_){}
 toast('Copiado!','ok');
}
function doCut(){doCopy();E.clip.cut=true;toast('Recortado. Cole no destino.','warn')}
function doPaste(){
 if(E.ro||!E.clip)return;pushUndo();
 const sh=curSheet(),cl=E.clip;
 for(const key in cl.data){
  const parts=key.split('_').map(Number);
  const r=E.sel.r1+parts[0],c=E.sel.c1+parts[1];if(r>=sh.rows||c>=sh.cols)continue;
  sh.cells[keyOf(r,c)]=JSON.parse(JSON.stringify(cl.data[key]));
 }
 if(cl.cut){
  for(let r=cl.r1;r<=cl.r1+cl.rows-1;r++)for(let c=cl.c1;c<=cl.c1+cl.cols-1;c++){
   const cell=sh.cells[keyOf(r,c)];if(cell){delete cell.v;delete cell.f;if(!cell.s)delete sh.cells[keyOf(r,c)]}}
  cl.cut=false;
 }
 computeSheet(sh);refreshAll();touch();
}
function pasteText(txt){
 pushUndo();const sh=curSheet();
 const lines=txt.split(/\r?\n/);if(lines.length&&lines[lines.length-1]==='')lines.pop();
 lines.forEach(function(line,dr){
  line.split('\t').forEach(function(v,dc){
   const r=E.sel.r1+dr,c=E.sel.c1+dc;if(r>=sh.rows||c>=sh.cols||v==='')return;
   const k=keyOf(r,c);const cell=sh.cells[k]||{};cell.v=v;cell.f=v.startsWith('=')?v:null;sh.cells[k]=cell})});
 computeSheet(sh);refreshAll();touch();
}
function startColResize(c,e){
 const sh=curSheet();const startX=e.clientX;const startW=(sh.cw&&sh.cw[c])||96;
 const mv=function(ev){sh.cw=sh.cw||{};sh.cw[c]=Math.max(36,startW+ev.clientX-startX);
  const col=document.querySelector('#grid-wrap colgroup').children[c+1];if(col)col.style.width=sh.cw[c]+'px'};
 const up=function(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);touch()};
 document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}
function startRowResize(r,e){
 const sh=curSheet();const startY=e.clientY;const startH=(sh.rh&&sh.rh[r])||26;
 const mv=function(ev){sh.rh=sh.rh||{};sh.rh[r]=Math.max(18,startH+ev.clientY-startY);
  const tr=document.querySelector('#grid-wrap tbody').children[r];if(tr)tr.style.height=sh.rh[r]+'px'};
 const up=function(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);touch()};
 document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}
function rebuildAfterStruct(){computeSheet(curSheet());renderGrid();renderTabs();touch()}
function ensureRows(n){
 const p=api.plan();const sh=curSheet();
 if(sh.rows+n>p.maxRows){toast('Limite de '+p.maxRows+' linhas do plano '+p.name+' atingido.','err');upgradeModal(p.id==='free'?'Pro':'Premium');return false}
 return true;
}
function addRows(n){if(E.ro||!ensureRows(n))return;pushUndo();curSheet().rows+=n;rebuildAfterStruct()}
function addCols(n){if(E.ro)return;pushUndo();curSheet().cols+=n;rebuildAfterStruct()}
function insertRow(at){if(E.ro||!ensureRows(1))return;pushUndo();const sh=curSheet();const nc={};
 for(const k in sh.cells){const p=parseRef(k);nc[(p.r>=at?keyOf(p.r+1,p.c):k)]=sh.cells[k]}
 sh.cells=nc;sh.rows++;rebuildAfterStruct()}
function insertCol(at){if(E.ro)return;pushUndo();const sh=curSheet();const nc={};
 for(const k in sh.cells){const p=parseRef(k);nc[(p.c>=at?keyOf(p.r,p.c+1):k)]=sh.cells[k]}
 sh.cells=nc;sh.cols++;rebuildAfterStruct()}
function deleteRow(at){if(E.ro)return;pushUndo();const sh=curSheet();const nc={};
 for(const k in sh.cells){const p=parseRef(k);if(p.r===at)continue;nc[(p.r>at?keyOf(p.r-1,p.c):k)]=sh.cells[k]}
 sh.cells=nc;sh.rows=Math.max(5,sh.rows-1);rebuildAfterStruct()}
function deleteCol(at){if(E.ro)return;pushUndo();const sh=curSheet();const nc={};
 for(const k in sh.cells){const p=parseRef(k);if(p.c===at)continue;nc[(p.c>at?keyOf(p.r,p.c-1):k)]=sh.cells[k]}
 sh.cells=nc;sh.cols=Math.max(3,sh.cols-1);rebuildAfterStruct()}
function renderTabs(){
 const box=$('#tabs');if(!box)return;
 box.innerHTML=E.doc.data.sheets.map(function(s,i){return'<div class="tab '+(i===E.sheetIdx?'on':'')+'" draggable="'+(E.ro?'false':'true')+'" data-tab="'+i+'">'+esc(s.name)+'</div>'}).join('');
 $$('#tabs .tab').forEach(function(t){
  const i=+t.dataset.tab;
  t.onclick=function(e){if(e.detail===2&&!E.ro){renameSheet(i);return}switchSheet(i)};
  t.oncontextmenu=function(e){e.preventDefault();
   popMenu(e.clientX,e.clientY,[
    {ic:'eye',label:'Abrir',fn:function(){switchSheet(i)}},
    ...(!E.ro?[
     {ic:'edit',label:'Renomear',fn:function(){renameSheet(i)}},
     {ic:'copy',label:'Duplicar',fn:function(){dupSheet(i)}},
     {ic:'plus',label:'Nova aba à direita',fn:function(){addSheet(i+1)}},
     '-',
     {ic:'trash',label:'Excluir aba',danger:1,fn:function(){delSheet(i)}}]:[])])};
  t.ondragstart=function(e){e.dataTransfer.setData('text/plain',String(i))};
  t.ondragover=function(e){e.preventDefault();t.classList.add('drag-over')};
  t.ondragleave=function(){t.classList.remove('drag-over')};
  t.ondrop=function(e){e.preventDefault();t.classList.remove('drag-over');
   const from=+e.dataTransfer.getData('text/plain');if(isNaN(from)||from===i||E.ro)return;
   pushUndo();const arr=E.doc.data.sheets;const mv=arr.splice(from,1)[0];arr.splice(i,0,mv);
   E.sheetIdx=i;computeSheet(curSheet());renderTabs();renderGrid();touch()};
 });
}
function switchSheet(i){if(E.editing)commitEdit();E.sheetIdx=i;computeSheet(curSheet());renderTabs();renderGrid()}
function addSheet(at){
 if(E.ro)return;pushUndo();
 const n=E.doc.data.sheets.length+1;
 const s={id:uid(),name:'Página '+n,rows:100,cols:26,cells:{}};
 E.doc.data.sheets.splice(at!==undefined?at:E.doc.data.sheets.length,0,s);
 E.sheetIdx=at!==undefined?at:E.doc.data.sheets.length-1;
 computeSheet(curSheet());renderTabs();renderGrid();touch();
}
function renameSheet(i){
 const s=E.doc.data.sheets[i];
 const name=prompt('Novo nome da aba:',s.name);
 if(name&&name.trim()){pushUndo();s.name=name.trim().slice(0,40);renderTabs();touch()}
}
function dupSheet(i){
 if(E.ro)return;pushUndo();
 const cp=JSON.parse(JSON.stringify(E.doc.data.sheets[i]));
 cp.id=uid();cp.name+=' (cópia)';
 E.doc.data.sheets.splice(i+1,0,cp);E.sheetIdx=i+1;
 computeSheet(curSheet());renderTabs();renderGrid();touch();
}
function delSheet(i){
 if(E.ro)return;
 if(E.doc.data.sheets.length<=1)return toast('A planilha precisa ter pelo menos uma aba.','err');
 confirmBox('Excluir a aba <b>'+esc(E.doc.data.sheets[i].name)+'</b>?',function(){
  pushUndo();E.doc.data.sheets.splice(i,1);E.sheetIdx=Math.max(0,i-1);
  computeSheet(curSheet());renderTabs();renderGrid();touch()},'Excluir');
}
document.addEventListener('contextmenu',function(e){
 const td=e.target.closest('#grid-wrap td[data-r]');
 if(!td||!E.doc)return;
 e.preventDefault();
 const r=+td.dataset.r,c=+td.dataset.c;
 if(!(r>=E.sel.r1&&r<=E.sel.r2&&c>=E.sel.c1&&c<=E.sel.c2))setSel(r,c,r,c);
 popMenu(e.clientX,e.clientY,[
  {ic:'cut',label:'Recortar',fn:doCut},{ic:'copy',label:'Copiar',fn:doCopy},{ic:'clip',label:'Colar',fn:doPaste},'-',
  ...(!E.ro?[
   {ic:'plus',label:'Inserir linha acima',fn:function(){insertRow(r)}},
   {ic:'plus',label:'Inserir linha abaixo',fn:function(){insertRow(r+1)}},
   {ic:'plus',label:'Inserir coluna à esquerda',fn:function(){insertCol(c)}},
   {ic:'plus',label:'Inserir coluna à direita',fn:function(){insertCol(c+1)}},'-',
   {ic:'trash',label:'Excluir linha',danger:1,fn:function(){deleteRow(r)}},
   {ic:'trash',label:'Excluir coluna',danger:1,fn:function(){deleteCol(c)}},'-',
   {ic:'plus',label:'+10 linhas',fn:function(){addRows(10)}},
   {ic:'plus',label:'+1 coluna',fn:function(){addCols(1)}}]:[])
 ].filter(Boolean));
});

/* ---------- EXPORTAÇÃO ---------- */
function sheetMatrix(sh){
 const out=[];
 for(let r=0;r<sh.rows;r++){const row=[];
  for(let c=0;c<sh.cols;c++){const k=keyOf(r,c);
   const v=sh._disp[k]!==undefined?sh._disp[k]:(sh.cells[k]?sh.cells[k].v:'');
   row.push(v==null?'':v)}
  out.push(row)}
 while(out.length&&out[out.length-1].every(function(x){return x===''}))out.pop();
 return out.length?out:[['']];
}
function exportCSV(){
 const sh=curSheet();const m=sheetMatrix(sh);
 const csv='\ufeff'+m.map(function(row){return row.map(function(v){const s=String(v);return/[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')}).join('\r\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download=E.doc.name.replace(/[^\w\- ]/g,'')+' - '+sh.name+'.csv';a.click();
 api.log('export','Exportou CSV "'+E.doc.name+'"');toast('CSV exportado!','ok');
}
function exportXLSX(){
 if(!window.XLSX)return toast('Biblioteca XLSX indisponível (verifique a conexão).','err');
 const wb=XLSX.utils.book_new();
 E.doc.data.sheets.forEach(function(sh){
  computeSheet(sh);
  const ws=XLSX.utils.aoa_to_sheet(sheetMatrix(sh));
  XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,31));
 });
 XLSX.writeFile(wb,E.doc.name.replace(/[^\w\- ]/g,'')+'.xlsx');
 api.log('export','Exportou XLSX "'+E.doc.name+'"');toast('XLSX exportado!','ok');
}
/* PDF: sem nenhuma tag de script embutida — a impressão é disparada pela página principal */
function exportPDF(){
 const sh=curSheet();computeSheet(sh);const m=sheetMatrix(sh);
 const w=window.open('','_blank','width=980,height=700');
 if(!w)return toast('Pop-up bloqueado pelo navegador. Permita pop-ups para exportar PDF.','err');
 const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(E.doc.name)+'</title><style>'+
  'body{font-family:Arial;font-size:12px;padding:24px}h1{font-size:16px}'+
  'table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:4px 8px;text-align:left}'+
  '.hn{color:#666;font-size:10px;text-align:center;background:#f2f2f2}</style></head><body>'+
  '<h1>'+esc(E.doc.name)+' — '+esc(sh.name)+'</h1>'+
  '<p style="color:#777;font-size:11px">Gerado pelo Tabula em '+fmtDT(Date.now())+'</p>'+
  '<table><tr><td class="hn"></td>'+m[0].map(function(_,c){return'<td class="hn">'+colName(c)+'</td>'}).join('')+'</tr>'+
  m.map(function(row,r){return'<tr><td class="hn">'+(r+1)+'</td>'+row.map(function(v){return'<td>'+esc(String(v))+'</td>'}).join('')+'</tr>'}).join('')+
  '</table></body></html>';
 w.document.open();
 w.document.write(html);
 w.document.close();
 setTimeout(function(){try{w.focus();w.print()}catch(e){}},700);
 api.log('export','Exportou PDF "'+E.doc.name+'"');
 toast('Janela de impressão aberta — escolha "Salvar como PDF".','ok');
}

/* ---------- ROUTER ---------- */
function route(){
 closeMenu();
 if(E.doc&&E.dirty&&!E.ro){
  const i=db.docs.findIndex(x=>x.id===E.doc.id);
  if(i>=0){db.docs[i]=cleanDoc(Object.assign({},E.doc,{updatedAt:Date.now()}));persist()}
  E.dirty=false;
 }
 const h=location.hash||'#/';
 const u=api.me();
 if(u&&u.blocked){api.logout();toast('Conta bloqueada.','err')}
 const guard=function(){if(!api.me()){location.hash='#/login';return false}return true};
 if(h==='#/'||h==='#')vLanding();
 else if(h==='#/login'){if(u)location.hash='#/app';else vLogin()}
 else if(h==='#/register'){if(u)location.hash='#/app';else vRegister()}
 else if(h==='#/recover')vRecover();
 else if(h==='#/app'){if(guard())vApp()}
 else if(h==='#/billing'){if(guard())vBilling()}
 else if(h==='#/profile'){if(guard())vProfile()}
 else if(h==='#/admin'){if(guard())vAdmin()}
 else if(h.indexOf('#/editor/')===0){if(guard())vEditor(h.split('/')[2])}
 else location.hash='#/';
 const s=document.getElementById('side');if(s)s.classList.remove('open');
}
addEventListener('hashchange',route);
addEventListener('beforeunload',function(){if(E.doc&&E.dirty&&!E.ro){
 const i=db.docs.findIndex(x=>x.id===E.doc.id);
 if(i>=0){db.docs[i]=cleanDoc(Object.assign({},E.doc,{updatedAt:Date.now()}));persist()}}});
route();
</script>
